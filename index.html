<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nopal / KOOPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0B0C;
    --ink: #EDEAE4;
    --ink-dim: #8C8A85;
    --red: #E3222E;
    --line: rgba(237,234,228,0.16);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size:15px;
    letter-spacing:0.02em;
  }

  a{ color:inherit; }

  /* xerox noise overlay */
  .noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:0.06;
    mix-blend-mode:overlay;
  }

  /* top bar */
  header{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    background: var(--bg);
    border-bottom: 4px solid var(--ink);
  }

  .header-inner{
    max-width:440px;
    margin:0 auto;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:26px;
    letter-spacing:0.02em;
    color: var(--red);
    text-transform:uppercase;
    text-decoration:none;
    transition: transform 0.15s ease;
    display:inline-block;
  }

  .glyphs{
    display:flex;
    gap:16px;
    font-size:18px;
    color: var(--ink);
    letter-spacing:0;
  }

  main{
    max-width:440px;
    margin:0 auto;
    min-height:100vh;
    padding: 96px 16px 56px;
    border-left: 4px solid var(--ink);
    border-right: 4px solid var(--ink);
  }

  .find-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:56px;
  }

  .find-row .bar{
    width:48px;
    height:4px;
    background: var(--red);
    flex:none;
  }

  .find-row p{
    margin:0;
    font-size:11px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color: var(--ink);
  }

  .tracks-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom:8px;
    margin-bottom:0;
  }

  .tracks-head h2{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:32px;
    letter-spacing:0.01em;
    text-transform:uppercase;
    margin:0;
  }

  .tracks-head span{
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--ink-dim);
  }

  .links{
    display:flex;
    flex-direction:column;
  }

  .track-item{
    display:flex;
    align-items:center;
    gap:16px;
    padding: 18px 4px;
    border-bottom: 2px solid var(--ink);
    text-decoration:none;
    color: var(--ink);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .track-item:hover, .track-item:focus-visible{
    background-color: var(--red);
    color: var(--bg);
    outline:none;
  }

  .track-index{
    font-size:12px;
    color: var(--ink-dim);
    flex:none;
    width:20px;
    transition: color 0.15s ease;
  }

  .track-item:hover .track-index{ color: var(--bg); }

  .track-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:0.01em;
    text-transform:uppercase;
    flex:1;
  }

  .track-arrow{
    font-size:18px;
    color: var(--red);
    flex:none;
    transition: color 0.15s ease;
  }

  .track-item:hover .track-arrow{ color: var(--bg); }

  footer{
    margin-top:56px;
    border-top: 4px solid var(--ink);
    padding-top:34px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .foot-links{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
  }

  .foot-links a{
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    text-decoration:none;
  }

  .foot-links a:hover{ color: var(--red); }

  .foot-links a.terminate{
    color: var(--red);
    text-decoration:underline;
  }

  .foot-bottom{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }

  .foot-bottom .state{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .foot-bottom .state span:first-child{
    font-size:11px;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color: var(--ink-dim);
  }

  .foot-bottom .state span:last-child{
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
  }

  .stencil{
    font-family:'Anton', sans-serif;
    font-size:32px;
    line-height:1;
    -webkit-text-stroke: 1px var(--ink);
    color: transparent;
  }

  @media (prefers-reduced-motion: reduce){
    .brand, .track-item, .track-index, .track-arrow{ transition:none; }
  }
</style>
</head>
<body>

<svg class="noise">
  <filter id="noiseFilter">
    <feTurbulence baseFrequency="0.6" numOctaves="3" stitchTiles="stitch" type="fractalNoise"></feTurbulence>
  </filter>
  <rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>

<header>
  <div class="header-inner">
    <span class="brand" id="brandMark">&#8224; NOPAL &#8224;</span>
    <div class="glyphs">
      <span>((&bull;))</span>
      <span>&#8801;</span>
    </div>
  </div>
</header>

<main>
  <section class="find-row">
    <span class="bar"></span>
    <p>Find me elsewhere too.</p>
  </section>

  <section>
    <div class="tracks-head">
      <h2>Tracks</h2>
      <span id="volTag">Vol. 001</span>
    </div>
    <nav class="links" id="linkList"></nav>
  </section>

  <footer>
    <div class="foot-links">
      <a href="#">Manifesto</a>
      <a href="#">Encryption</a>
      <a href="#" class="terminate">Terminate</a>
    </div>
    <div class="foot-bottom">
      <div class="state">
        <span>System_state: nominal</span>
        <span>&copy; <span id="year"></span> Koops Media</span>
      </div>
      <div class="stencil">NP</div>
    </div>
  </footer>
</main>

<script>
  // Edit array di bawah untuk menambah / mengubah / menghapus tautan.
  const links = [
    { title: "KOOPS Media", url: "https://koopsmedia.vercel.app" },
    { title: "Instagram", url: "https://instagram.com/noopaall" },
    { title: "Roblox", url: "https://www.roblox.com/share-links?code=6d936908a835984e91044f253133a300&type=Profile&source=ProfileShare" },
    { title: "Spotify", url: "https://open.spotify.com/user/9ryrfp3gl9ubpwzn7dc41yyeu" },
    { title: "TikTok", url: "https://tiktok.com/@mavisssjoy" },
    { title: "Letterboxd", url: "https://letterboxd.com/noopaall/" }
  ];

  const pad = n => String(n).padStart(2, '0');

  document.getElementById('linkList').innerHTML = links.map((l, i) => `
    <a class="track-item" href="${l.url}" target="_blank" rel="noopener noreferrer">
      <span class="track-index">${pad(i + 1)}</span>
      <span class="track-title">${l.title}</span>
      <span class="track-arrow">&#8599;</span>
    </a>
  `).join('');

  document.getElementById('volTag').textContent = 'Vol. ' + pad(links.length);
  document.getElementById('year').textContent = new Date().getFullYear();

  // subtle skew flicker on brand mark hover
  const brand = document.getElementById('brandMark');
  brand.addEventListener('mouseover', () => {
    brand.style.transform = `skew(${Math.random() * 2 - 1}deg, ${Math.random() * 2 - 1}deg)`;
  });
  brand.addEventListener('mouseout', () => {
    brand.style.transform = 'none';
  });

  // random digital-decay flicker on track indices
  const indices = document.querySelectorAll('.track-index');
  setInterval(() => {
    if (!indices.length) return;
    const el = indices[Math.floor(Math.random() * indices.length)];
    const original = el.style.color;
    el.style.color = '#E3222E';
    setTimeout(() => { el.style.color = original; }, 100);
  }, 3000);
</script>

</body>
</html>
